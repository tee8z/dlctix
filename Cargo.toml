[package]
name = "dlctix"
version = "0.0.9"
edition = "2021"
authors = ["conduition <conduition@proton.me>"]
description = "Ticketed Discreet Log Contracts"
readme = "README.md"
license = "Unlicense"
repository = "https://github.com/tee8z/dlctix"
keywords = ["dlc", "smart", "contract", "ticket", "auction"]
exclude = ["/img"]

[dependencies]
bitcoin = { version = "0.32.102", default-features = false, features = [
    "std",
    "serde",
] }
hex = { version = "0.4.3", default-features = false, features = ["alloc"] }
musig2 = { version = "0.4.1", default-features = false, features = [
    "secp256k1",
    "rand",
    "serde",
] }
rand = { version = "0.9.5", default-features = false }
secp = { version = "0.7.0", default-features = false, features = ["serde"] }
serde = { version = "1.0.229", default-features = false, features = ["derive"] }
serdect = { version = "0.4.3", default-features = false, features = ["alloc"] }
sha2 = { version = "0.10.9", default-features = false }

[dev-dependencies]
bitcoincore-rpc = "0.19.0"
ciborium = "0.2.2"
dotenvy = "0.15.7"
once_cell = "1.21.4"
serde = { version = "1.0.229", default-features = false, features = ["derive"] }
serde_json = { version = "1.0.151", default-features = false, features = [] }
tempfile = "3.27.0"

[package.metadata.docs.rs]
all-features = true
rustdoc-args = ["--cfg", "docsrs"]
